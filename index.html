
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My DevOps CI/CD Project</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 45px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #172554;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .success {
            color: #16a34a;
            font-size: 26px;
            margin-bottom: 15px;
        }

        .message {
            color: #475569;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .status {
            display: inline-block;
            background: #dcfce7;
            color: #15803d;
            padding: 9px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .version {
            color: #94a3b8;
            margin-top: 20px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My DevOps CI/CD Project</h1>

        <p class="subtitle">Sample deployed web application</p>

        <h2 class="success">Deployment Successful!</h2>

        <p class="message">
            This application was automatically deployed using
            Jenkins, Docker, and Ansible.
        </p>

        <div class="status">
            Application Running...
        </div>

        <p class="version">Version: 1.0</p>

    </div>

</body>
</html>
